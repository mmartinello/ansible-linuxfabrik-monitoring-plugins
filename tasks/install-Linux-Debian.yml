---
- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gpg

- name: Force set the 'linuxfabrik_monitoring_plugins_dest_path' variable
  ansible.builtin.set_fact:
    linuxfabrik_monitoring_plugins_dest_path: /usr/lib64/nagios/plugins

- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Download the Linuxfabrik Monitoring Plugins APT Repository Key
  ansible.builtin.get_url:
    url: https://repo.linuxfabrik.ch/linuxfabrik.key
    dest: /etc/apt/keyrings/linuxfabrik.asc
    mode: '0644'
    owner: root
    group: root

- name: Add Linuxfabrik Monitoring Plugins APT Repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/linuxfabrik.asc] https://repo.linuxfabrik.ch/monitoring-plugins/{{ ansible_distribution | lower }}/ {{ ansible_distribution_release }}-release main"
    state: present
    filename: linuxfabrik-monitoring-plugins

- name: Gather the installed packages
  ansible.builtin.package_facts:
    manager: apt
  when: linuxfabrik_monitoring_plugins_upgrade

# Old releases used date based versions (e.g. 2024060401) that dpkg considers
# newer than the current semantic versions (e.g. 8.0.0), so they can't be
# upgraded and must be removed first
- name: Remove Linuxfabrik Monitoring Plugins installed with a date based version
  ansible.builtin.apt:
    name: linuxfabrik-monitoring-plugins
    state: absent
  when:
    - linuxfabrik_monitoring_plugins_upgrade
    - "'linuxfabrik-monitoring-plugins' in ansible_facts.packages"
    - ansible_facts.packages['linuxfabrik-monitoring-plugins'] | selectattr('version', 'match', '^\\d{10}(-|$)') | list | length > 0

- name: Install Linuxfabrik Monitoring Plugins
  ansible.builtin.apt:
    name: "{{ 'linuxfabrik-monitoring-plugins' if linuxfabrik_monitoring_plugins_version == 'latest' else 'linuxfabrik-monitoring-plugins=' ~ linuxfabrik_monitoring_plugins_version ~ ('' if '-' in linuxfabrik_monitoring_plugins_version else '-*') }}"
    update_cache: true
    allow_downgrade: "{{ linuxfabrik_monitoring_plugins_version != 'latest' }}"
    state: "{{ 'latest' if linuxfabrik_monitoring_plugins_upgrade and linuxfabrik_monitoring_plugins_version == 'latest' else 'present' }}"
